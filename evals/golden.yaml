  checks: [{column: passer_name, kind: name}]

# Broad questions the data can answer one reasonable way (rule 1): answered, not no_data.
- id: broad_best_qb
  question: Who's the best quarterback in the NFL right now?
  expect: answer
  # "Right now" is the current season (rule 1), so the answer must say it's still in progress.
  contains_any: [estimate, in progress, so far, not complete, incomplete, partial, not final, still]
- {id: broad_best_defense, question: "Which team has the best defense?", expect: answer}
- {id: broad_most_improved, question: "Which team improved the most from 2024 to 2025?", expect: answer}

# Any NFL question the marts can answer, not only QBs and contracts.
- id: lions_wins_2024
  question: How many regular-season games did the Lions win in 2024?
  expect: answer
  truth: >
    select count(*) as wins from game_results_vs_spread
    where season = 2024 and game_type = 'REG'
      and ((home_team = 'DET' and home_score > away_score) or (away_team = 'DET' and away_score > home_score))
  checks: [{column: wins, kind: count}]

