- id: full_name_best_epa_2024
  question: Who had the highest EPA per dropback in 2024? Give his full name.
  expect: answer
  truth: select passer_full_name from qb_season_epa where season = 2024 order by epa_per_dropback desc limit 1
  checks: [{column: passer_full_name, kind: full_name}]

- id: ats_regular_season_2024
  question: Which team covered the spread most often in 2024, and how many times?
  expect: answer
  # Regular season only, unless the question says playoffs (rule 8).
  # team_name too, so "LA Chargers" counts as naming LAC (the team check accepts the nickname).
  truth: >
    select team, (select max(team_name) from team_season_epa t where t.team = c.team) as team_name,
      count(*) as covers from (
      select home_team as team from game_results_vs_spread where season = 2024 and game_type = 'REG' and ats_result = 'home'
      union all
      select away_team from game_results_vs_spread where season = 2024 and game_type = 'REG' and ats_result = 'away'
    ) c group by team order by covers desc limit 1
  checks: [{column: team, kind: team}, {column: covers, kind: count}]

# The example questions on the page: a suggested question must always get a good answer.
- id: example_prescott
  question: Is Dak Prescott worth his contract?
  expect: answer
  truth: select 'D.Prescott' as passer_name
  checks: [{column: passer_name, kind: name}]

- id: example_best_offense_2024
  question: Which offense was the most efficient in 2024?
  expect: answer
  truth: select team, team_name from team_season_epa where season = 2024 order by off_epa_per_play desc limit 1
  checks: [{column: team, kind: team}]

- id: example_ats_2024
  question: Which team covered the spread most often in 2024?
  expect: answer
  # team_name too, so "LA Chargers" counts as naming LAC (the team check accepts the nickname).
  truth: >
    select team, (select max(team_name) from team_season_epa t where t.team = c.team) as team_name,
      count(*) as covers from (
      select home_team as team from game_results_vs_spread where season = 2024 and game_type = 'REG' and ats_result = 'home'
      union all
      select away_team from game_results_vs_spread where season = 2024 and game_type = 'REG' and ats_result = 'away'
    ) c group by team order by covers desc limit 1
  checks: [{column: team, kind: team}]

# No season given: any season is a fair reading, so this only has to be answered.
- {id: example_fourth_down, question: "Who's the most aggressive team on fourth down?", expect: answer}

