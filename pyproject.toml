[project]
name = "nfl_dagster"
version = "0.1.0"
description = "Learning Dagster with nflverse NFL data, Snowflake, and dbt"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    # Dagster+ needs it inside the running code location.
    "dagster-cloud",
    "dagster-snowflake",
    "psycopg[binary]",
    "sqlglot",
    "anthropic",
    "pyyaml",
    "dagster-dbt",
    "dbt-snowflake",
    "nflreadpy>=0.1.5",
    "polars",
    "pyarrow",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest", "python-dotenv", "matplotlib", "dagster-dg-cli"]

# What `uv sync` installs by default (it reads dependency groups, not extras). The Dagster+
# deploy workflow builds its environment that way and runs `dg` from it.
[dependency-groups]
dev = ["dagster-dg-cli"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The dbt project copied into the package by `dagster-dbt project prepare-and-package` at
# deploy time (see resources.py). Locally the folder doesn't exist and this matches nothing.
[tool.setuptools.package-data]
nfl_dagster = ["dbt-project/**/*"]

[tool.dagster]
module_name = "nfl_dagster.definitions"
code_location_name = "nfl_dagster"

# Same project, described for the `dg` CLI (Dagster+ deploys use it).
[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "nfl_dagster"
code_location_target_module = "nfl_dagster.definitions"
code_location_name = "nfl_dagster"
