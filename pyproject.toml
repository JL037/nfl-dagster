[project]
name = "nfl_dagster"
version = "0.1.0"
description = "Learning Dagster with nflverse NFL data, DuckDB, and dbt"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "dagster-duckdb",
    "dagster-dbt",
    "dbt-duckdb",
    "nflreadpy>=0.1.5",
    "polars",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "nfl_dagster.definitions"
code_location_name = "nfl_dagster"
