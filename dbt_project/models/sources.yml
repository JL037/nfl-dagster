version: 2

sources:
  - name: raw
    description: Raw nflverse data, loaded into Snowflake by the Dagster raw_* assets.
    # <database>.RAW, the schema the raw assets COPY INTO, in whichever database the current
    # target builds into (NFL_DEV for dev, NFL for prod).
    database: "{{ target.database }}"
    schema: RAW
    tables:
      - name: teams
        description: One row per NFL team (nflreadpy.load_teams).
        config:
          meta:
            # dagster-dbt: this source IS the Dagster asset `raw_teams`, so the
            # asset graph draws raw_teams -> stg_teams.
            dagster:
              asset_key: ["raw_teams"]

      - name: pbp
        description: >
          Play-by-play, one row per play (nflreadpy.load_pbp), all seasons in one table.
          Each Dagster partition replaces one season's rows.
        config:
          meta:
            dagster:
              asset_key: ["raw_pbp"]

      - name: schedules
        description: Schedule and results, one row per game (nflreadpy.load_schedules), all seasons.
        config:
          meta:
            dagster:
              asset_key: ["raw_schedules"]

      - name: players
        description: >
          One row per player (nflreadpy.load_players), loaded whole each time. gsis_id is
          play-by-play's passer_id; display_name is the full name.
        config:
          meta:
            dagster:
              asset_key: ["raw_players"]

      - name: rosters
        description: >
          One row per player, team and season (nflreadpy.load_rosters), every season from 2015,
          loaded whole each time. position is the group (OL, WR, ...); depth_chart_position is
          the spot (T, G, C for linemen). gsis_id is play-by-play's player id.
        config:
          meta:
            dagster:
              asset_key: ["raw_rosters"]

      - name: contracts
        description: >
          One row per contract (nflreadpy.load_contracts, OverTheCap via nflverse), loaded whole
          each time. season_history and contract_history are VARIANT lists that describe the
          player, not the contract: every row for a player carries the same lists. The source
          also has exact duplicate rows; stg_cap_hits handles both.
        config:
          meta:
            dagster:
              asset_key: ["raw_contracts"]
