version: 2

models:
  - name: team_season_epa
    description: Offensive and defensive EPA per play and success rate per team and regular season.
    columns:
      - name: team_season_key
        description: team and season joined, e.g. KC-2025.
        data_tests:
          - unique
          - not_null
      - name: team_name
        description: Null would mean a pbp team code missing from stg_teams.
        data_tests:
          - not_null

  - name: qb_season_epa
    description: >
      QB EPA per dropback and success rate per regular season, minimum 200 dropbacks in a
      finished season (pro-rated while a season is in progress).
    columns:
      - name: qb_season_key
        description: passer_id and season joined.
        data_tests:
          - unique
          - not_null
      - name: passer_full_name
        description: >
          Full name from nflverse's player table (e.g. Jordan Love); the short passer_name
          (J.Love) when the player isn't in it. Use this name when writing about a player.
        data_tests:
          - not_null

  - name: qb_contract_value
    description: >
      Every QB season from qb_season_epa with its cap hit, its share of the league salary cap,
      and epa_over_expected: EPA per dropback above what QBs paid that share usually produce.
      Definitions and their measured effect are in the SQL.
    columns:
      - name: qb_season_key
        description: passer_id and season joined, the same key as qb_season_epa.
        data_tests:
          - unique
          - not_null
      - name: passer_full_name
        description: Full name, from qb_season_epa (e.g. Jordan Love). Use this name when writing about a player.
      - name: cap_share
        description: cap_number / the league salary cap that season. Null without a cap hit.
      - name: is_cap_hit_for_team
        description: >
          False when OverTheCap's team for the season isn't the team he played for (released
          or traded mid-season), or there's no cap hit. Those rows get no score.
        data_tests:
          - not_null
      - name: expected_epa_per_dropback
        description: The fitted line at this cap_share (fitted on finished seasons only).
        data_tests:
          # Every row with a cap hit for his team must get a score.
          - not_null:
              config:
                where: "is_cap_hit_for_team"
      - name: worth_it
        description: True when epa_over_expected > 0. Null for rows without a score.

  - name: game_results_vs_spread
    description: Played games and whether the home or away team covered the spread.
    columns:
      - name: game_id
        data_tests:
          - unique
          - not_null
      - name: spread_line
        description: >
          Points the home team was favored by. A missing spread leaves ats_result null, so
          this warns (rather than fails): the game is still a valid result, but it drops out
          of every ATS rate, and someone should know.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: ats_result
        description: home, away, or push. Null when the game has no spread_line.
        data_tests:
          - accepted_values:
              arguments:
                values: ["home", "away", "push"]

  - name: team_fourth_down
    description: >
      Fourth-and-short decisions per team and regular season: go-for-it rate and conversion
      rate, in competitive game states (win probability 10-90%). See the SQL for why each
      filter is there.
    columns:
      - name: team_season_key
        description: team and season joined, e.g. IND-2025.
        data_tests:
          - unique
          - not_null
      - name: team_name
        description: Null would mean a team code missing from stg_teams.
        data_tests:
          - not_null
      - name: go_pct
        description: Percent of fourth-and-short decisions where the team went for it.
      - name: conversion_pct
        description: Percent of go-for-it attempts that gained a first down. Null if the team never went for it.

# Unit tests run a model's SQL on a few hand-written input rows and compare the output to
# what we expect. Unlike the data tests above, they test the logic, not the data, so they
# can cover cases the real data doesn't have yet (no played game is missing a spread today).
# They run in Snowflake (dbt build / dbt test), with the inputs as literal rows.

  - name: player_season_efficiency
    description: >
      Efficiency and consistency per player, regular season and role (passer, rusher,
      receiver), with the player's team, full name and position. Rows meet a volume minimum
      (200 dropbacks, 150 rushes or 50 targets in a full season, pro-rated in progress).
      Definitions, including "most consistent", are in the SQL.
    columns:
      - name: player_season_role_key
        description: player_id, season and role joined.
        data_tests:
          - unique
          - not_null
      - name: player_name
        description: Full name (e.g. Amon-Ra St. Brown). Use this name when writing about a player.
        data_tests:
          - not_null
      - name: role
        description: passer (every dropback), rusher (designed runs only) or receiver (targets).
        data_tests:
          - accepted_values:
              arguments:
                values: ["passer", "rusher", "receiver"]
      - name: team
        description: The team he made the most plays for in this role that season.
      - name: position
        description: Position from nflverse's player table (QB, RB, WR, TE, ...).
      - name: epa_per_play
        description: EPA per dropback (passer), per designed rush (rusher) or per target (receiver).
      - name: success_rate
        description: Share of his plays in this role that nflverse counts as successful.
      - name: completions
        description: Passes completed (passer) or caught (receiver); 0 for rushers.
      - name: completion_rate
        description: completions / plays for passers and receivers (catch rate); null for rushers.
      - name: qualifying_games
        description: Games with at least 10 dropbacks, 5 rushes or 3 targets; consistency is measured over these.
      - name: positive_game_share
        description: >
          Share of qualifying games with positive total EPA. Higher = more consistent. Most runs
          lose EPA, so rushers' shares are much lower than receivers' or passers': compare it
          within a role.
      - name: game_epa_per_play_sd
        description: Standard deviation of EPA per play across qualifying games. Lower = steadier.

  - name: team_player_leaders
    description: >
      Per team, regular season and role, the most efficient player (highest epa_per_play) and
      the most consistent (highest positive_game_share, ties broken by the lower
      game_epa_per_play_sd), among players meeting player_season_efficiency's minimums.
    columns:
      - name: team_season_role_key
        description: team, season and role joined.
        data_tests:
          - unique
          - not_null

  - name: team_rosters
    description: >
      Season rosters, one row per player, team and season (2015 on): position, linemen's spot
      (position_spot T, G, C), status, experience, age, college and draft. Compare two seasons
      by joining on player_id (e.g. who is still on the roster since 2018).
    columns:
      - name: roster_key
        description: player_id, team and season joined.
        data_tests:
          - unique
          - not_null
      - name: position
        description: Position group (QB, RB, WR, TE, OL, DL, LB, DB, K, P, LS).
      - name: position_spot
        description: Specific spot, e.g. T, G or C for offensive linemen.
      - name: status
        description: ACT = active roster; other values are reserve, injured, practice squad and similar.
      - name: age
        description: Age in whole years on September 1 of the season.
      - name: years_exp
        description: Years of NFL experience.
      - name: draft_number
        description: Overall draft pick; null for undrafted players.

  - name: team_offensive_line
    description: >
      Offensive line results per team and regular season: pass protection (sack and QB-hit
      rates per dropback), run blocking on designed runs (EPA, success, yards per carry, stuff
      and explosive rates, by direction), and the active linemen's count, experience and age.
      Unit results that also reflect the QB, running back and scheme; no individual lineman
      grades. Definitions are in the SQL.
    columns:
      - name: team_season_key
        description: team and season joined.
        data_tests:
          - unique
          - not_null
      - name: sack_rate
        description: sacks / dropbacks. Lower is better pass protection.
      - name: qb_hit_rate
        description: Dropbacks where the QB was hit / dropbacks. Lower is better.
      - name: rush_epa_per_play
        description: EPA per designed run (no scrambles).
      - name: stuff_rate
        description: Share of designed runs for 0 yards or fewer. Lower is better.
      - name: explosive_run_rate
        description: Share of designed runs for 10 yards or more.
      - name: ol_players
        description: Active (ACT) offensive linemen on the season roster.

unit_tests:
  - name: ats_result_covers_pushes_and_missing_spreads
    description: >
      result = home_score - away_score, spread_line = points the home team is favored by.
      Home covers when result > spread_line, away when result < spread_line, a push when
      they're equal. A game with no spread has no ATS result: null, not 'push'.
    model: game_results_vs_spread
    given:
      - input: ref('stg_schedules')
        rows:
          - {game_id: home_covers, is_played: true, home_team: KC, away_team: LV, result: 10, spread_line: 7}
          - {game_id: away_covers, is_played: true, home_team: KC, away_team: LV, result: 3, spread_line: 7}
          - {game_id: push, is_played: true, home_team: KC, away_team: LV, result: 7, spread_line: 7}
          - {game_id: no_spread, is_played: true, home_team: KC, away_team: LV, result: 7, spread_line: null}
          - {game_id: not_played, is_played: false, home_team: KC, away_team: LV, result: null, spread_line: 3}
    expect:
      rows:
        - {game_id: home_covers, home_cover_margin: 3, ats_winner: KC, ats_result: home}
        - {game_id: away_covers, home_cover_margin: -4, ats_winner: LV, ats_result: away}
        - {game_id: push, home_cover_margin: 0, ats_winner: PUSH, ats_result: push}
        - {game_id: no_spread, home_cover_margin: null, ats_winner: null, ats_result: null}

  - name: contract_value_scores_against_finished_seasons
    description: >
      The expected line is fitted on finished seasons with a cap hit for the QB's own team,
      then applied to every scored row. Here the two finished, scored rows (cap share 0.25,
      EPA 0; cap share 0.75, EPA 0.5) give the line EPA = cap_share - 0.25. The in-progress
      2026 row and the Vikings row (cap hit from the team he ended with, not the Giants he
      played for) must not move the line; if either did, every expected value would change.
      Washington's old name ('Redskins') still matches WAS. A row exactly on the line is not
      worth it. No cap row means no score.
    model: qb_contract_value
    given:
      - input: ref('qb_season_epa')
        rows:
          - {qb_season_key: cheap-2024, season: 2024, passer_id: P1, team: NE, epa_per_dropback: 0.0, is_season_complete: true}
          - {qb_season_key: paid-2024, season: 2024, passer_id: P2, team: KC, epa_per_dropback: 0.5, is_season_complete: true}
          - {qb_season_key: on_line-2024, season: 2024, passer_id: P3, team: WAS, epa_per_dropback: 0.25, is_season_complete: true}
          - {qb_season_key: moved-2024, season: 2024, passer_id: P4, team: NYG, epa_per_dropback: 0.9, is_season_complete: true}
          - {qb_season_key: no_cap-2024, season: 2024, passer_id: P5, team: NE, epa_per_dropback: 0.1, is_season_complete: true}
          - {qb_season_key: early-2026, season: 2026, passer_id: P1, team: NE, epa_per_dropback: 0.9, is_season_complete: false}
      - input: ref('stg_cap_hits')
        rows:
          - {gsis_id: P1, season: 2024, cap_number: 25, team_name: Patriots}
          - {gsis_id: P2, season: 2024, cap_number: 75, team_name: Chiefs}
          - {gsis_id: P3, season: 2024, cap_number: 50, team_name: Redskins}
          - {gsis_id: P4, season: 2024, cap_number: 0, team_name: Vikings}
          - {gsis_id: P1, season: 2026, cap_number: 50, team_name: Patriots}
      - input: ref('league_salary_caps')
        rows:
          - {season: 2024, salary_cap_millions: 100}
          - {season: 2026, salary_cap_millions: 100}
      - input: ref('stg_teams')
        rows:
          - {team_abbr: NE, team_nick: Patriots}
          - {team_abbr: KC, team_nick: Chiefs}
          - {team_abbr: WAS, team_nick: Commanders}
          - {team_abbr: NYG, team_nick: Giants}
    expect:
      rows:
        - {qb_season_key: cheap-2024, is_cap_hit_for_team: true, expected_epa_per_dropback: 0.0, epa_over_expected: 0.0, worth_it: false}
        - {qb_season_key: paid-2024, is_cap_hit_for_team: true, expected_epa_per_dropback: 0.5, epa_over_expected: 0.0, worth_it: false}
        - {qb_season_key: on_line-2024, is_cap_hit_for_team: true, expected_epa_per_dropback: 0.25, epa_over_expected: 0.0, worth_it: false}
        - {qb_season_key: moved-2024, is_cap_hit_for_team: false, expected_epa_per_dropback: null, epa_over_expected: null, worth_it: null}
        - {qb_season_key: no_cap-2024, is_cap_hit_for_team: false, expected_epa_per_dropback: null, epa_over_expected: null, worth_it: null}
        - {qb_season_key: early-2026, is_cap_hit_for_team: true, expected_epa_per_dropback: 0.25, epa_over_expected: 0.65, worth_it: true}

  - name: qb_season_full_names
    description: >
      passer_full_name comes from stg_players (nflverse's player table), so the Ask page can
      write "Jordan Love" instead of guessing from "J.Love". A passer missing from the player
      table keeps his row, with his short name; no QB season is dropped or doubled.
    model: qb_season_epa
    given:
      - input: ref('stg_schedules')
        rows:
          - {season: 2025, game_type: REG, is_played: true}
      - input: ref('stg_pbp')
        rows:
          - {season: 2025, season_type: REG, qb_dropback: 1, passer_id: P1, passer_name: J.Love, posteam: GB, epa: 0.2, success: 1, qb_scramble: 0}
          - {season: 2025, season_type: REG, qb_dropback: 1, passer_id: P2, passer_name: X.Unknown, posteam: NE, epa: 0.1, success: 0, qb_scramble: 0}
      - input: ref('stg_players')
        rows:
          - {player_id: P1, player_name: Jordan Love}
          - {player_id: P3, player_name: Someone Else}
    # The 200-dropback minimum would drop both one-play passers; the test overrides it.
    overrides:
      vars:
        qb_min_dropbacks: 0
    expect:
      rows:
        - {qb_season_key: P1-2025, passer_name: J.Love, passer_full_name: Jordan Love}
        - {qb_season_key: P2-2025, passer_name: X.Unknown, passer_full_name: X.Unknown}

  - name: consistency_counts_qualifying_games_only
    description: >
      Consistency is measured over qualifying games (5+ rushes for a rusher): a 1-rush game
      doesn't count. Two of three qualifying games had positive EPA, so the share is 2/3.
    model: player_season_efficiency
    given:
      - input: ref('stg_schedules')
        rows:
          - {season: 2025, game_type: REG, is_played: true}
      - input: ref('int_player_games')
        rows:
          - {season: 2025, game_id: G1, role: rusher, player_id: RB, team: DET, plays: 10, epa: 2.0, successes: 6, yards: 50, completions: 0, touchdowns: 1, interceptions: 0}
          - {season: 2025, game_id: G2, role: rusher, player_id: RB, team: DET, plays: 8, epa: -1.0, successes: 3, yards: 20, completions: 0, touchdowns: 0, interceptions: 0}
          - {season: 2025, game_id: G3, role: rusher, player_id: RB, team: DET, plays: 6, epa: 0.6, successes: 3, yards: 30, completions: 0, touchdowns: 0, interceptions: 0}
          - {season: 2025, game_id: G4, role: rusher, player_id: RB, team: DET, plays: 1, epa: -2.0, successes: 0, yards: -3, completions: 0, touchdowns: 0, interceptions: 0}
      - input: ref('stg_players')
        rows:
          - {player_id: RB, player_name: Jahmyr Gibbs, position: RB}
    overrides:
      vars:
        player_min_plays_scale: 0
    expect:
      rows:
        - {player_season_role_key: RB-2025-rusher, player_name: Jahmyr Gibbs, team: DET, games: 4, plays: 25, qualifying_games: 3, positive_game_share: 0.6666666666666666}
