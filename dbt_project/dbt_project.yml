name: nfl
version: "0.1.0"
config-version: 2

# Must match the top-level key in profiles.yml.
profile: nfl

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

models:
  nfl:
    # Staging models are thin cleanups of raw data: cheap views.
    staging:
      +materialized: view
      # dagster-dbt reads meta.dagster.group to put these assets in their own group.
      +meta:
        dagster:
          group: staging
    # Marts are what people query: store them as real tables.
    marts:
      +materialized: table
      +meta:
        dagster:
          group: marts
