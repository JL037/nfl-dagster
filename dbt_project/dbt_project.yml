name: nfl
version: "0.1.0"
config-version: 2

# Must match the top-level key in profiles.yml.
profile: nfl

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

models:
  nfl:
    # Staging models are thin cleanups of raw data: cheap views.
    staging:
      +materialized: view
      # Builds into NFL.STAGING (see macros/generate_schema_name.sql). dagster-dbt also adds
      # the schema to the asset key: staging/stg_pbp.
      +schema: staging
      # dagster-dbt reads meta.dagster.group to put these assets in their own group.
      +meta:
        dagster:
          group: staging
    # Intermediate models: building blocks the marts share, too big or too fine to publish
    # (int_player_games is one row per player per game). Tables, in NFL.INTERMEDIATE.
    intermediate:
      +materialized: table
      +schema: intermediate
      +meta:
        dagster:
          group: intermediate
    # Marts are what people query: store them as real tables.
    marts:
      +materialized: table
      +schema: marts
      +meta:
        dagster:
          group: marts

# Seeds are small CSVs in seeds/ that dbt loads as tables: reference data that changes once
# a year and isn't in any source, like the league salary cap.
seeds:
  nfl:
    +schema: staging
    +meta:
      dagster:
        group: staging
