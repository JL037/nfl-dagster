name: Dagster Cloud Serverless Deployment

# Scaffolded by `dg plus deploy configure serverless --git-provider github`, then changed in
# three places (marked "nfl-dagster:"). Deploys main to the `prod` deployment of the learning1
# organization. Secrets live in Dagster+ (Deployment settings -> Environment variables), not here;
# the only GitHub secret is DAGSTER_CLOUD_API_TOKEN, which lets this workflow deploy.
#
# nfl-dagster: main only, no pull_request trigger. On a PR the scaffold makes a branch
# deployment, which needs its own secrets and spends credits on every push.
on:
  push:
    branches:
      - "main"

concurrency:
  # Cancel in-progress deploys to same branch
  group: ${{ github.ref }}/deploy
  cancel-in-progress: true
env:
  # The organization name in Dagster Cloud
  DAGSTER_CLOUD_ORGANIZATION: "learning1"
  # The Dagster Cloud URL
  DAGSTER_CLOUD_URL: "https://dagster.cloud/learning1"
  # The API token from https://dagster.cloud/ should be stored in Secrets
  DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
  # Path to the root folder containing the dagster project
  DAGSTER_PROJECT_DIR: "."
  # Enable PEX-based fast deploys (set to "false" to use Docker builds instead)
  ENABLE_FAST_DEPLOYS: "true"
  # Python version used to deploy the project
  # nfl-dagster: the version CI tests with (ci.yml), so the deploy runs what was tested.
  PYTHON_VERSION: "3.12"
  # GitHub token for PR comments and branch deployments
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  dagster_cloud_default_deploy:
    name: Dagster Serverless Deploy
    runs-on: ubuntu-22.04

    steps:
      - name: Prerun Checks
        id: prerun
        uses: dagster-io/dagster-cloud-action/actions/utils/prerun@v1.13.26

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      # Detect if this is branch deployment and initialize the build session
      - name: Initialize build session
        id: ci-init
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-deploy-init@v1.13.26
        with:
          project_dir: ${{ env.DAGSTER_PROJECT_DIR }}
          # A full deployment name. If this run is for a pull request, this value will be used as
          # the base deployment for the branch deployment.
          deployment: "prod"

      # Ensure the correct Python version is installed
      - name: Set up Python ${{ env.PYTHON_VERSION }} for target
        id: setup-python-version
        if: steps.prerun.outputs.result != 'skip'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: steps.prerun.outputs.result != 'skip'
        run: ${{ steps.setup-python-version.outputs.python-path }} -m pip install uv
        shell: bash

      # Sync all projects (workspace or single project)
      - name: Sync project dependencies
        if: steps.prerun.outputs.result != 'skip'
        run: |
          cd ${{ env.DAGSTER_PROJECT_DIR }}
          for project in $(${{ steps.setup-python-version.outputs.python-path }} -m uv run dg list projects); do
            (cd "$project" && ${{ steps.setup-python-version.outputs.python-path }} -m uv sync)
          done
        shell: bash

      # Refresh state for any StateBackedComponents in the project
      - name: Refresh defs state
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-cli@v1.13.26
        with:
          command: "plus deploy refresh-defs-state --target-path=${{ env.DAGSTER_PROJECT_DIR }}"

      # nfl-dagster: build the dbt manifest and copy the dbt project into the package
      # (src/nfl_dagster/dbt-project), because the deployed package has no repo folder around
      # it. Built for prod, the deployment's target. dbt parse doesn't connect to Snowflake,
      # so placeholders satisfy profiles.yml, as in ci.yml.
      - name: Prepare dbt project for deployment
        if: steps.prerun.outputs.result == 'pex-deploy'
        env:
          NFL_ENV: prod
          SNOWFLAKE_ACCOUNT: ci-placeholder
          SNOWFLAKE_USER: ci-placeholder
          SNOWFLAKE_ROLE: ci-placeholder
          SNOWFLAKE_WAREHOUSE: ci-placeholder
        run: |
          cd ${{ env.DAGSTER_PROJECT_DIR }}
          ${{ steps.setup-python-version.outputs.python-path }} -m uv run dagster-dbt project prepare-and-package --file src/nfl_dagster/resources.py
        shell: bash

      # If using fast build, install setuptools for PEX builds
      - name: Install setuptools
        if: steps.prerun.outputs.result == 'pex-deploy'
        run: ${{ steps.setup-python-version.outputs.python-path }} -m pip install setuptools
        shell: bash

      # Otherwise, enable buildx for caching Docker builds
      - name: Set up Docker Buildx
        if: steps.prerun.outputs.result == 'docker-deploy'
        uses: docker/setup-buildx-action@v3

      # Build and push (PEX or Docker based on project configuration)
      - name: Build and push
        id: build-and-push
        if: steps.prerun.outputs.result == 'pex-deploy' || steps.prerun.outputs.result == 'docker-deploy'
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-cli@v1.13.26
        with:
          command: "plus deploy build-and-push --agent-type=serverless --python-version ${{ env.PYTHON_VERSION }} --build-strategy=${{ env.ENABLE_FAST_DEPLOYS == 'true' && 'python-executable' || 'docker' }}"

      # Deploy all code locations in this build session to Dagster Cloud
      - name: Deploy to Dagster Cloud
        id: ci-deploy
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-cli@v1.13.26
        with:
          command: "plus deploy finish"

      # Update a PR comment - this runs always() so the comment is updated on success and failure
      - name: Update PR comment for branch deployments
        id: ci-notify
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.13.26
        with:
          command: "ci notify --project-dir=${{ env.DAGSTER_PROJECT_DIR }}"

      # Generate a summary that shows up on the Workflow Summary page
      - name: Generate a summary
        id: ci-summary
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.13.26
        with:
          command: "ci status --output-format=markdown >> $GITHUB_STEP_SUMMARY"
